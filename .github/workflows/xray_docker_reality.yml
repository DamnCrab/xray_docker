name: xray_docker_reality

on:
  workflow_dispatch:
  schedule:
    - cron: '0 20 */2 * *'  # UTC 20:00  UTC+8 04:00
  push:
    paths:
      - 'reality/Dockerfile'
      - '.github/workflows/xray_docker_reality.yml'
      - 'reality/entrypoint.sh'
      - 'reality/config.json'
      - 'reality/VERSION'
  pull_request:
    paths:
      - 'reality/Dockerfile'
      - '.github/workflows/xray_docker_reality.yml'
      - 'reality/entrypoint.sh'
      - 'reality/config.json'
      - 'reality/VERSION'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-22.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
          - platform: linux/arm/v7
            runner: ubuntu-24.04-arm
          - platform: linux/arm/v6
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}
    steps:
      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV
          OWNER_LC=${OWNER,,}
          echo "OWNER_LC=${OWNER_LC}" >> $GITHUB_ENV
        env:
          OWNER: '${{ github.repository_owner }}'

      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract first line of commit message
        shell: bash
        run: |
          VERSION=$(cat reality/VERSION)
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Get latest Xray-core version (including pre-release)
        run: |
          LATEST_VERSION=$(curl -s https://api.github.com/repos/XTLS/Xray-core/releases | jq -r '.[0].tag_name')
          echo "XRAY_VERSION=$LATEST_VERSION" >> $GITHUB_ENV

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6.18.0
        with:
          context: ./reality
          file: ./reality/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=damncrab/xray_docker_reality,name=ghcr.io/${{ env.OWNER_LC }}/xray_docker_reality,push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-reality-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-22.04
    needs: build
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-reality-*
          merge-multiple: true

      - name: Docker Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout for Version
        uses: actions/checkout@v4

          VERSION=$(cat reality/VERSION)
          LATEST_VERSION=$(curl -s https://api.github.com/repos/XTLS/Xray-core/releases | jq -r '.[0].tag_name')
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "XRAY_VERSION=$LATEST_VERSION" >> $GITHUB_ENV
          OWNER_LC=${OWNER,,}
          echo "OWNER_LC=${OWNER_LC}" >> $GITHUB_ENV
        env:
          OWNER: '${{ github.repository_owner }}'

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create -t damncrab/xray_docker_reality:${{env.VERSION}}-ubuntu-22.04-xray-${{env.XRAY_VERSION}} \
            -t damncrab/xray_docker_reality:latest \
            -t ghcr.io/${{ env.OWNER_LC }}/xray_docker_reality:${{env.VERSION}}-ubuntu-22.04-xray-${{env.XRAY_VERSION}} \
            -t ghcr.io/${{ env.OWNER_LC }}/xray_docker_reality:latest \
            $(printf 'damncrab/xray_docker_reality@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect damncrab/xray_docker_reality:latest
          docker buildx imagetools inspect ghcr.io/${{ env.OWNER_LC }}/xray_docker_reality:latest
