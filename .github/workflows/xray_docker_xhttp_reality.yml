name: xray_docker_xhttp_reality

on:
  workflow_dispatch:
  schedule:
    - cron: '0 21 */2 * *'  # UTC 21:00  UTC+8 05:00
  push:
    paths:
      - 'xhttp_reality/Dockerfile'
      - '.github/workflows/xray_docker_xhttp_reality.yml'
      - 'xhttp_reality/entrypoint.sh'
      - 'xhttp_reality/config.json'
      - 'xhttp_reality/VERSION'
  pull_request:
    paths:
      - 'xhttp_reality/Dockerfile'
      - '.github/workflows/xray_docker_xhttp_reality.yml'
      - 'xhttp_reality/entrypoint.sh'
      - 'xhttp_reality/config.json'
      - 'xhttp_reality/VERSION'

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
          - linux/arm/v7
          - linux/arm/v6
    steps:
      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract first line of commit message
        shell: bash
        run: |
          VERSION=$(cat xhttp_reality/VERSION)
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Get latest Xray-core version (including pre-release)
        run: |
          LATEST_VERSION=$(curl -s https://api.github.com/repos/XTLS/Xray-core/releases | jq -r '.[0].tag_name')
          echo "XRAY_VERSION=$LATEST_VERSION" >> $GITHUB_ENV

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6.18.0
        with:
          context: ./xhttp_reality
          file: ./xhttp_reality/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=damncrab/xray_docker_xhttp_reality,push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-xhttp-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-22.04
    needs: build
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-xhttp-*
          merge-multiple: true

      - name: Docker Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Checkout for Version
        uses: actions/checkout@v4

      - name: Set Environment Variables
        run: |
          VERSION=$(cat xhttp_reality/VERSION)
          LATEST_VERSION=$(curl -s https://api.github.com/repos/XTLS/Xray-core/releases | jq -r '.[0].tag_name')
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "XRAY_VERSION=$LATEST_VERSION" >> $GITHUB_ENV

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create -t damncrab/xray_docker_xhttp_reality:${{env.VERSION}}-ubuntu-22.04-xray-${{env.XRAY_VERSION}} \
            -t damncrab/xray_docker_xhttp_reality:latest \
            $(printf 'damncrab/xray_docker_xhttp_reality@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect damncrab/xray_docker_xhttp_reality:latest
